[project]
name = "mkdocstrings-matlab"
version = "0.0.0"
description = "A MATLAB handler for mkdocstrings"
authors = [
    { name = "Mark Hu", email = "watermarkhu@gmail.com" }
]
license =  { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11, <3.16"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "griffe>=2.3.2,<3",
    "maxx>=0.10.4,<1",
    "mkdocstrings>=1.0.8,<2",
    "mkdocs-autorefs>=1.4,<2",
    "pymdown-extensions>=12.3,<13",
    "charset-normalizer>=3.5.2,<4",
    "textmate-grammar-python>=1.1.0",
    "certifi>=2026.10.18",
]

[dependency-groups]
dev = [
    "ty==0.0.95",
    "prek>=0.5.9,<1",
    "ruff>=0.17.3,<1",
    "pydantic>=2.14,<2.15",
    "pydantic-core>=2.35.0,<3",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "beautifulsoup4>=4.15.0,<5",
    "inline-snapshot>=0.36.1,<1",
    "mkdocs-material>=9.8.0,<10",
    "rumdl>=0.3.2",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    "zensical>=0.0.74",
]
mkdocs = [
    "mkdocs<2",
    "mkdocs-material>=9.8.0",
    "mkdocstrings-python>=2.0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "docs"]
managed = true

[tool.pytest]
minversion = "9.0"
addopts = ["-v", "--tb=short", "--color=yes"]
pythonpath = [
    "test"
]
markers = [
    "without_handler"
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",  # Python specific errors
    "W",  # Warnings
    "F",  # Pyflakes (code complexity)
    "I",  # isort
]
ignore = [
    "E501",  # Line too long
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.inline-snapshot]
test-dir = "test"
storage-dir = "test/snapshots"
format-command = "ruff format --config pyproject.toml --stdin-filename {filename}"
default-flags=["create", "trim"]

[tool.ty.src]
include = ["src"]
exclude = ["test"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocstrings_handlers"]
